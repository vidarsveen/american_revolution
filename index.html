<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Den amerikanske revolusjonen 1763–1783</title>
<meta name="description" content="Interaktivt kart og tidslinje over den amerikanske revolusjonen — slagene, menneskene og vendepunktene, år for år.">
<meta name="theme-color" content="#efe6d4">
<meta name="color-scheme" content="light dark">

<!-- Home-screen app on iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Revolusjonen">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icons/icon-180.png">

<!-- Get the map tiles moving before the parser reaches the script -->
<link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin>
<link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin>
<link rel="preload" href="./assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="./vendor/leaflet.css">
<link rel="stylesheet" href="./css/fonts.css">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/shell.css">
<link rel="stylesheet" href="./css/map.css">
<link rel="stylesheet" href="./css/timeline.css">
<link rel="stylesheet" href="./css/sheet.css">
</head>
<body>

<div class="boot">
  <div class="boot__mark">Den amerikanske revolusjonen</div>
  <div class="boot__bar"></div>
</div>

<div class="app">
  <header class="topbar"><!-- built by main.js --></header>

  <main class="views">
    <section class="view view--map is-active" data-view="map">
      <div id="map"></div>
      <div class="map-wash"></div>
      <div class="map-grain"></div>
      <div class="map-vignette"></div>
      <!-- scrubber, tour caption and map tools are appended here -->
    </section>

    <section class="view view--timeline" data-view="timeline"></section>

    <section class="view view--people" data-view="people"></section>
  </main>

  <nav class="tabbar" role="tablist"><!-- built by main.js --></nav>
</div>

<script src="./vendor/leaflet.js"></script>
<script type="module" src="./js/main.js"></script>
<script>
  // Service worker is optional: the app works fine without it.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
