<body>

<div class="boot">
  <div class="boot__mark">Fortell</div>
  <div class="boot__bar"></div>
</div>

<div class="app">
  <header class="topbar"><!-- built by main.js --></header>

  <main class="views">
    <section class="view view--story is-active" data-view="story"></section>

    <section class="view view--map" data-view="map">
      <div id="map"></div>
      <!-- wash and grain are drawn by the map module, above the ground and
           below the labels. The vignette is a lens effect, so it stays out
           here anchored to the viewport. -->
      <div class="map-vignette"></div>
      <!-- scrubber, tour caption and map tools are appended here -->
    </section>

    <section class="view view--timeline" data-view="timeline"></section>

    <section class="view view--library" data-view="library"></section>
  </main>

  <nav class="tabbar" role="tablist"><!-- built by main.js --></nav>
</div>

<script type="module" src="./js/main.js"></script>
<script>
  // Service worker is optional: the app works fine without it.
  //
  // Not on localhost, though. A caching worker in front of a dev server means
  // an edit can appear to have no effect — you get the previous build back and
  // spend the next twenty minutes debugging code that is not running. Offline
  // behaviour gets tested on the deployed site instead.
  (function () {
    if (!('serviceWorker' in navigator)) return;
    var local = ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) >= 0;
    if (local) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
      if (window.caches) {
        caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); })
          .catch(function () {});
      }
      return;
    }
    // Was an OLD worker already in charge when this page loaded? If so, the
    // assets on screen came out of its cache, and they are the previous
    // build. The new worker calls skipWaiting() and clients.claim(), so it
    // takes over a second or two later -- and at THAT moment one reload is
    // the difference between a deploy landing and a person being told to
    // clear their cache.
    //
    // This is the fix for a real, twice-reported problem: a change was live
    // on the server, check-published.py said so, and the browser kept
    // showing the previous version because networkFirst answered from cache.
    //
    // Guards, all three necessary: nothing to replace on a first-ever visit
    // (controller was null); never more than once per session, or a worker
    // that keeps claiming becomes a reload loop; and never while the
    // narration is actually playing, because yanking the page out from under
    // someone mid-sentence is worse than a stale picture.
    var KEY = 'fortell:sw-reloaded';
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController) return;
      var a = document.querySelector('audio');
      if (a && !a.paused) return;
      try {
        if (sessionStorage.getItem(KEY)) return;
        sessionStorage.setItem(KEY, '1');
      } catch (e) { return; }
      location.reload();
    });

    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }());
</script>
</body>
</html>
