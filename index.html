<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>Romerriket 44 f.Kr.–14 e.Kr.</title>
<meta name="description" content="Hvordan Octavian tok makten, og hva Augustus gjorde med den – kart, kilder og mennesker.">
<meta name="theme-color" content="#efe6d4">
<meta name="color-scheme" content="light dark">

<!-- Home-screen app on iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Romerriket">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icons/icon-180.png">

<!-- Get the map tiles moving before the parser reaches the script -->
<link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin>
<link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin>
<link rel="preload" href="./assets/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>

<link rel="stylesheet" href="./css/fonts.css">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/shell.css">
<link rel="stylesheet" href="./css/map.css">
  <link rel="stylesheet" href="./css/atlas.css">
<link rel="stylesheet" href="./css/timeline.css">
<link rel="stylesheet" href="./css/sheet.css">
  <link rel="stylesheet" href="./css/dossier.css">
<link rel="stylesheet" href="./css/story.css">
</head>
<body>

<div class="boot">
  <div class="boot__mark">Romerriket</div>
  <div class="boot__bar"></div>
</div>

<div class="app">
  <header class="topbar"><!-- built by main.js --></header>

  <main class="views">
    <section class="view view--story is-active" data-view="story"></section>

    <section class="view view--map" data-view="map">
      <div id="map"></div>
      <!-- wash and grain are drawn by the map module, above the ground and
           below the labels. The vignette is a lens effect, so it stays out
           here anchored to the viewport. -->
      <div class="map-vignette"></div>
      <!-- scrubber, tour caption and map tools are appended here -->
    </section>

    <section class="view view--timeline" data-view="timeline"></section>

    <section class="view view--people" data-view="people"></section>
  </main>

  <nav class="tabbar" role="tablist"><!-- built by main.js --></nav>
</div>

<script type="module" src="./js/main.js"></script>
<script>
  // Service worker is optional: the app works fine without it.
  //
  // Not on localhost, though. A caching worker in front of a dev server means
  // an edit can appear to have no effect — you get the previous build back and
  // spend the next twenty minutes debugging code that is not running. Offline
  // behaviour gets tested on the deployed site instead.
  (function () {
    if (!('serviceWorker' in navigator)) return;
    var local = ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) >= 0;
    if (local) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
      if (window.caches) {
        caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); })
          .catch(function () {});
      }
      return;
    }
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }());
</script>
</body>
</html>
